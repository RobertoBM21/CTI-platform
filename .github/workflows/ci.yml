name: CI CTI Platform

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "package.json"
      - "pnpm-*.yaml"
      - ".github/workflows/**"
      - "docker-compose*.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "package.json"
      - "pnpm-*.yaml"
      - ".github/workflows/**"
      - "docker-compose*.yml"

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser (Chromium)
        run: pnpm --filter @cti-platform/frontend exec playwright install --with-deps chromium

      - name: Linting (workspace)
        run: pnpm lint

      - name: Run unit tests (workspace)
        run: pnpm test

      - name: Build and start production stack (Docker Compose)
        run: docker compose --env-file .env.example -f docker-compose.yml up -d --build

      - name: Wait for backend and frontend readiness
        run: pnpm dlx wait-on http://localhost:3000 http://localhost:3001 -t 120000

      - name: Run E2E tests (workspace)
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Build applications (workspace)
        run: pnpm build

      - name: Show Docker Compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --no-color
